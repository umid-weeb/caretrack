<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CareTrack CRM – Profil</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div id="ct-sidebar-overlay" class="ct-sidebar-overlay"></div>
<div class="ct-shell">
  <aside class="ct-sidebar" id="ct-sidebar"></aside>
  <div class="ct-main" id="ct-main">
    <header class="ct-topbar" id="ct-topbar"></header>
    <main class="ct-page" id="ct-page">
      <div class="ct-loading-overlay"><div class="ct-spinner"></div> Yuklanmoqda…</div>
    </main>
  </div>
</div>

<!-- Password change drawer -->
<div class="ct-drawer-overlay" id="pwdDrawer-overlay"></div>
<div class="ct-drawer" id="pwdDrawer">
  <div class="ct-drawer-header">
    <h2 class="ct-drawer-title">Parolni o'zgartirish</h2>
    <button class="ct-drawer-close" onclick="closeDrawer('pwdDrawer')">✕</button>
  </div>
  <div class="ct-drawer-body">
    <div id="pwdAlert"></div>
    <div class="ct-form-group">
      <label class="ct-label">Joriy parol <span class="required">*</span></label>
      <input type="password" class="ct-input" id="currentPwd" placeholder="Hozirgi parol"/>
    </div>
    <div class="ct-form-group">
      <label class="ct-label">Yangi parol <span class="required">*</span></label>
      <input type="password" class="ct-input" id="newPwd" placeholder="Kamida 6 ta belgi"/>
    </div>
    <div class="ct-form-group">
      <label class="ct-label">Yangi parolni tasdiqlang <span class="required">*</span></label>
      <input type="password" class="ct-input" id="confirmPwd" placeholder="Takrorlang"/>
    </div>
  </div>
  <div class="ct-drawer-footer">
    <button class="ct-btn ct-btn-outline" onclick="closeDrawer('pwdDrawer')">Bekor qilish</button>
    <button class="ct-btn ct-btn-primary" id="savePwdBtn" onclick="changePassword()">Saqlash</button>
  </div>
</div>

<div id="ct-toasts" class="ct-toast-wrap"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
