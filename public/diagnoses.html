<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>CareTrack CRM – Tashxislar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div id="ct-sidebar-overlay" class="ct-sidebar-overlay"></div>
<div class="ct-shell">
  <aside class="ct-sidebar" id="ct-sidebar"></aside>
  <div class="ct-main" id="ct-main">
    <header class="ct-topbar" id="ct-topbar"></header>
    <main class="ct-page" id="ct-page">
      <div class="ct-loading-overlay"><div class="ct-spinner"></div> Yuklanmoqda…</div>
    </main>
  </div>
</div>

<!-- Diagnosis Drawer -->
<div class="ct-drawer-overlay" id="dxDrawer-overlay"></div>
<div class="ct-drawer" id="dxDrawer">
  <div class="ct-drawer-header">
    <h2 class="ct-drawer-title" id="dxDrawerTitle">Tashxis qo'shish</h2>
    <button class="ct-drawer-close" onclick="closeDrawer('dxDrawer')">✕</button>
  </div>
  <div class="ct-drawer-body">
    <div id="dxDrawerAlert"></div>
    <input type="hidden" id="dxId"/>
    <div class="ct-form-group">
      <label class="ct-label">Bemor <span class="required">*</span></label>
      <select class="ct-select" id="dxPatient" required>
        <option value="">— bemorni tanlang —</option>
      </select>
    </div>
    <div class="ct-form-row">
      <div class="ct-form-group">
        <label class="ct-label">ICD-10 kodi <span class="required">*</span></label>
        <input type="text" class="ct-input" id="dxIcd" placeholder="I10, G43.9, L70.0…"/>
      </div>
      <div class="ct-form-group">
        <label class="ct-label">Og'irlik darajasi <span class="required">*</span></label>
        <select class="ct-select" id="dxSeverity" required>
          <option value="Low">🟢 Low – Past</option>
          <option value="Medium">🟡 Medium – O'rta</option>
          <option value="High">🔴 High – Yuqori</option>
          <option value="Critical">⚫ Critical – Kritik</option>
        </select>
      </div>
    </div>
    <div class="ct-form-row">
      <div class="ct-form-group" style="grid-column:1/-1">
        <label class="ct-label">Tashxis nomi <span class="required">*</span></label>
        <input type="text" class="ct-input" id="dxTitle" placeholder="Arterial gipertenziya…"/>
      </div>
    </div>
    <div class="ct-form-group">
      <label class="ct-label">Tashxis sanasi <span class="required">*</span></label>
      <input type="date" class="ct-input" id="dxDate"/>
    </div>
    <div class="ct-form-group">
      <label class="ct-label">Tavsif</label>
      <textarea class="ct-textarea" id="dxDesc" placeholder="Klinik belgilar va ko'rsatkichlar…"></textarea>
    </div>
    <div class="ct-form-group">
      <label class="ct-label">Izohlar / dori buyurtmasi</label>
      <textarea class="ct-textarea" id="dxNotes" placeholder="Tayinlangan dorilar, yo'naltirish…"></textarea>
    </div>
  </div>
  <div class="ct-drawer-footer">
    <button class="ct-btn ct-btn-outline" onclick="closeDrawer('dxDrawer')">Bekor qilish</button>
    <button class="ct-btn ct-btn-primary" id="saveDxBtn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Saqlash
    </button>
  </div>
</div>

<div id="ct-toasts" class="ct-toast-wrap"></div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/diagnoses.js"></script>
</body>
</html>
